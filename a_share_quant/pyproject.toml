[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-structure-research"
version = "0.1.0"
description = "Causal daily-structure A-share research baseline, not live trading"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["numpy==2.3.5", "matplotlib==3.10.8"]

[project.scripts]
ashare-quant = "ashare_quant.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
