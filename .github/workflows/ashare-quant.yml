name: A-share research checks
on:
  push:
    paths: ['a_share_quant/**', '.github/workflows/ashare-quant.yml']
  pull_request:
    paths: ['a_share_quant/**', '.github/workflows/ashare-quant.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: a_share_quant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests data/scripts
      - run: PYTHONPATH=src python -m ashare_quant --help
